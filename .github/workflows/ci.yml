name: CI

# Verificação em todo push/PR: compila, roda lint e testes unitários.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar o Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      # Em ABIs: o CI só precisa de arm64-v8a (compila o C++ uma vez só).
      - name: Compilar, lint e testes unitários
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest -Pbdsm.abis=arm64-v8a --stacktrace

      # Analise estatica (nao compila). Achados antigos ficam nos baselines versionados
      # (config/detekt/baseline-*.xml e <modulo>/ktlint-baseline.xml): so codigo novo e cobrado.
      - name: Análise estática (detekt e ktlint)
        run: ./gradlew detekt ktlintCheck --continue --stacktrace

      - name: Enviar relatórios (lint, detekt, ktlint e testes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/detekt/**
            **/build/reports/ktlint/**
            **/build/reports/tests/**
            **/build/test-results/**
