name: OBS Plugin Nativo (BDSM Link)

# Compila o plugin nativo do OBS Studio (obs-plugin-native/) no Windows x64 com MSVC,
# roda os testes (CTest), empacota ZIP + instalador .exe (Inno Setup) e, em tag
# `obs-plugin-v*` (ex.: obs-plugin-v1.0.0), publica uma Release com os dois arquivos.
#
# Independente do workflow do APK: tags `v*` NAO casam com `obs-plugin-v*`.
on:
  push:
    branches: [main, master]
    tags: ["obs-plugin-v*"]
    paths:
      - "obs-plugin-native/**"
      - ".github/workflows/obs-plugin-native.yml"
  pull_request:
    paths:
      - "obs-plugin-native/**"
      - ".github/workflows/obs-plugin-native.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PLUGIN_DIR: obs-plugin-native
  BUILD_CONFIG: RelWithDebInfo

jobs:
  # Rapido e sem dependencias do OBS: a logica pura (core/) com g++ no Linux.
  core-tests:
    name: Testes da logica pura (Linux, sem OBS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurar, compilar e testar
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          cmake --preset tests-only
          cmake --build --preset tests-only --parallel
          ctest --preset tests-only

  windows-x64:
    name: Plugin Windows x64 (MSVC)
    # windows-latest agora aponta para o Windows Server 2025 com Visual Studio 2026 (sem o VS 2022 que o
    # preset do OBS 32.2.2 usa: "Visual Studio 17 2022"). Fixamos o windows-2022 (VS 2022).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Versao a partir da tag (obs-plugin-vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/obs-plugin-v')
        shell: pwsh
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          $ver = "${{ github.ref_name }}" -replace '^obs-plugin-v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Tag invalida '$ver': use obs-plugin-vX.Y.Z" }
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $spec.version = $ver
          $spec | ConvertTo-Json -Depth 10 | Set-Content buildspec.json -Encoding utf8
          Write-Host "Versao do plugin: $ver"

      - name: Ler versao
        id: ver
        shell: pwsh
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          "version=$($spec.version)" >> $env:GITHUB_OUTPUT
          "name=$($spec.name)" >> $env:GITHUB_OUTPUT

      - name: Cache das dependencias (OBS 32.2.2 + obs-deps + Qt6)
        uses: actions/cache@v4
        with:
          path: ${{ env.PLUGIN_DIR }}/.deps
          key: obs-deps-${{ runner.os }}-${{ hashFiles('obs-plugin-native/buildspec.json') }}

      # Usa os scripts do obs-plugintemplate: preset windows-ci-x64 (VS 2022, x64),
      # baixa/valida (SHA-256) OBS, obs-deps e Qt6, compila e instala em release/<config>.
      - name: Compilar (preset do template)
        shell: pwsh
        run: ./${{ env.PLUGIN_DIR }}/.github/scripts/Build-Windows.ps1 -Target x64 -Configuration ${{ env.BUILD_CONFIG }}

      - name: Testes (CTest)
        working-directory: ${{ env.PLUGIN_DIR }}
        run: ctest --test-dir build_x64 -C ${{ env.BUILD_CONFIG }} --output-on-failure

      # ZIP no MESMO layout do instalador e da documentacao do OBS (obsproject.com/kb/plugins-guide):
      #   bdsm-link\bin\64bit\bdsm-link.dll   e   bdsm-link\data\locale\*.ini
      # (o nome da DLL TEM de ser igual ao da pasta). Os .pdb ficam fora do ZIP (artefato proprio).
      - name: Empacotar ZIP (layout do OBS) e validar a estrutura
        shell: pwsh
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          $name = '${{ steps.ver.outputs.name }}'
          $ver = '${{ steps.ver.outputs.version }}'
          $src = "release/${{ env.BUILD_CONFIG }}/$name"
          foreach ($f in @("$src/bin/64bit/$name.dll", "$src/data/locale/en-US.ini", "$src/data/locale/pt-BR.ini")) {
            if (-not (Test-Path $f)) { throw "Arquivo esperado ausente: $f" }
          }
          $stage = Join-Path $env:RUNNER_TEMP 'zipstage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item $src (Join-Path $stage $name) -Recurse
          Get-ChildItem (Join-Path $stage $name) -Recurse -Filter *.pdb | Remove-Item -Force
          $zip = "release/$name-$ver-windows-x64.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage $name) -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          $entries | Format-Table
          if ($entries -notcontains "$name/bin/64bit/$name.dll") { throw "ZIP sem $name/bin/64bit/$name.dll" }
          if ($entries -notcontains "$name/data/locale/en-US.ini") { throw "ZIP sem $name/data/locale/en-US.ini" }

      - name: Instalador (.exe, Inno Setup)
        shell: pwsh
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($c in @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $c) { $iscc = $c; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\release\${{ env.BUILD_CONFIG }}\${{ steps.ver.outputs.name }}" installer\bdsm-link.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }
          Get-ChildItem release | Format-Table Name, Length

      # Teste de fumaca do instalador: instala em uma pasta temporaria (sem admin, silencioso),
      # confere o layout bin\64bit\bdsm-link.dll + data\locale e desinstala.
      - name: Teste de fumaca do instalador
        shell: pwsh
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $setup = (Resolve-Path "release/bdsm-link-$ver-windows-x64-setup.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP 'plugins\bdsm-link'
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalador retornou $($p.ExitCode)" }
          foreach ($f in @("bin\64bit\bdsm-link.dll", "data\locale\en-US.ini", "data\locale\pt-BR.ini")) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Instalador nao criou $f" }
          }
          Get-ChildItem $dir -Recurse | Select-Object -ExpandProperty FullName
          $unins = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $unins) { throw "Desinstalador nao registrado em $dir" }
          $u = Start-Process $unins.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Desinstalador retornou $($u.ExitCode)" }

      - name: Artefato - ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bdsm-link-${{ steps.ver.outputs.version }}-windows-x64-zip
          path: ${{ env.PLUGIN_DIR }}/release/${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: Artefato - Instalador
        uses: actions/upload-artifact@v4
        with:
          name: bdsm-link-${{ steps.ver.outputs.version }}-windows-x64-setup
          path: ${{ env.PLUGIN_DIR }}/release/bdsm-link-${{ steps.ver.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

      - name: Artefato - Simbolos de depuracao (PDB)
        uses: actions/upload-artifact@v4
        with:
          name: bdsm-link-${{ steps.ver.outputs.version }}-windows-x64-pdb
          path: ${{ env.PLUGIN_DIR }}/release/${{ env.BUILD_CONFIG }}/${{ steps.ver.outputs.name }}/bin/64bit/*.pdb
          if-no-files-found: warn

  release:
    name: Publicar Release (tag obs-plugin-v*)
    if: startsWith(github.ref, 'refs/tags/obs-plugin-v')
    needs: [core-tests, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bdsm-link-*-windows-x64-{zip,setup}
          merge-multiple: true

      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          ver="${GITHUB_REF_NAME#obs-plugin-v}"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BDSM Link para OBS Studio ${ver}" \
            --notes "Plugin nativo (dock + tally) para OBS Studio 32.x, Windows x64. Instale com o arquivo *-setup.exe (padrao: %PROGRAMDATA%\\obs-studio\\plugins\\bdsm-link, exige administrador; opcao 'somente para mim': %APPDATA%\\obs-studio\\plugins\\bdsm-link) ou extraia a pasta bdsm-link do ZIP em uma dessas pastas de plugins. Requer o DistroAV (plugin NDI do OBS) e o NDI Runtime para receber o video do celular; NAO estao incluidos. NAO use junto com o script Python bdsm_link_obs.py. Veja obs-plugin-native/README.md."
