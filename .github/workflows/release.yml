name: Build and Release APK

# Dispara em duas situações:
#  - push de uma tag no padrão v* (ex: v1.0.0) -> gera Release automaticamente
#  - disparo manual pela aba Actions do GitHub -> build ad-hoc de teste
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # M1: release em tag NUNCA pode sair com a chave de debug.
      - name: Exigir segredos de assinatura (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v ausente: tag de release exige assinatura."
              missing=1
            fi
          done
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' fora do padrão vMAJOR.MINOR.PATCH."
            missing=1
          fi
          exit $missing

      - name: Validar o Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      # Decodifica o keystore fora do repositório (RUNNER_TEMP) e expõe só o caminho.
      # `base64 --decode` ignora quebras de linha do secret (equivale ao getMimeDecoder).
      - name: Preparar keystore de release
        if: env.KEYSTORE_BASE64 != ''
        run: |
          KS="$RUNNER_TEMP/bdsm-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      # Em tag o app/build.gradle.kts recusa assinar com a chave de debug
      # (GITHUB_REF_TYPE=tag). Em disparo manual sem secrets o APK sai com chave de
      # debug apenas para teste e é nomeado como tal no artefato.
      - name: Compilar APK (release)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ./gradlew assembleRelease -PforceReleaseVersion="$VERSION" -PrequireReleaseSigning=true --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Localizar o APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Nenhum APK encontrado em app/build/outputs/apk/release"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Enviar APK como artefato do job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && 'bdsm-release-apk' || (env.KEYSTORE_BASE64 != '' && 'bdsm-release-apk' || 'bdsm-release-apk-DEBUG-SIGNED') }}
          path: ${{ steps.find_apk.outputs.apk_path }}

      # M2: mapping.txt é necessário para desofuscar crashes desta versão.
      - name: Arquivar mapping do R8
        uses: actions/upload-artifact@v4
        with:
          name: bdsm-r8-mapping
          if-no-files-found: warn
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/missing_rules.txt
            app/build/outputs/mapping/release/usage.txt

      # Só cria/atualiza o Release do GitHub quando o disparo foi por tag.
      - name: Publicar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
