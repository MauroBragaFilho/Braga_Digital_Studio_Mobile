name: Build and Release APK

# Dispara em duas situações:
#  - push de uma tag no padrão v* (ex: v1.0.0) -> gera Release automaticamente
#  - disparo manual pela aba Actions do GitHub -> build ad-hoc de teste
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      # Quando os secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS /
      # KEY_PASSWORD existirem, o app/build.gradle.kts monta o signingConfig
      # "release" e este build gera um APK assinado. Sem os secrets, cai na
      # assinatura de debug (não é distribuição oficial).
      - name: Compilar APK (release)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleRelease -PforceReleaseVersion=$VERSION --no-daemon
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Localizar o APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Nenhum APK encontrado em app/build/outputs/apk/release"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Enviar APK como artefato do job
        uses: actions/upload-artifact@v4
        with:
          name: bdsm-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      # Só cria/atualiza o Release do GitHub quando o disparo foi por tag.
      - name: Publicar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}