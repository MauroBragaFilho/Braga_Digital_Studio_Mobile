# Heap: KSP (Hilt + Room) + Kotlin + Compose estouram 2 GB em build completo, entao o Gradle
# fica em 3 GB (era 4 GB; o daemon chegava a ~4,1 GB de RAM). Se aparecer OutOfMemoryError em
# build limpo, volte para -Xmx4g.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
# O daemon do Gradle se encerra sozinho apos 10 min parado (padrao: 3 h), liberando a RAM.
org.gradle.daemon.idletimeout=600000
kotlin.code.style=official

# Build mais rapido (B10)
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache LIGADO. Validado com `help`, `detekt ktlintCheck` e o grafo de
# :app:assembleRelease/:app:testDebugUnitTest (--dry-run): app/build.gradle.kts le
# local.properties/env na configuracao (entradas rastreadas pelo Gradle) e o gate de
# assinatura roda em taskGraph.whenReady (fase de configuracao). Problemas na execucao
# de tarefas de terceiros viram aviso (nao quebram o build). Para desligar pontualmente:
# ./gradlew assembleDebug --no-configuration-cache
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true
# Jetifier mantido ligado: nao foi possivel verificar (sem rodar Gradle) se o
# UVCAndroid 1.0.8 ou alguma transitiva ainda traz android.support.*. Para testar,
# desligar e rodar `./gradlew :app:checkDebugDuplicateClasses assembleDebug`.
android.enableJetifier=true
